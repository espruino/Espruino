name: Code pattern lint

# Checks C code for patterns that waste flash memory (or leak JsVar locks).
# See scripts/check_code_patterns.py --list-rules. Most findings can be fixed
# automatically with: scripts/check_code_patterns.py --fix

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check_code_patterns:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
          python-version: '3.12'
    - name: Install tree-sitter
      run: pip install tree-sitter==0.26.0 tree-sitter-c==0.24.2
    - name: Check code patterns
      run: python3 scripts/check_code_patterns.py --github
